<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lore — Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #0a0a0a; }
  .wrap { position: relative; width: 100%; min-height: 100vh; overflow: hidden; }
  .wrap img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: 50% 60%;
    filter: grayscale(1) brightness(0.82) contrast(1.05);
  }
  .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(8,8,8,.55) 0%, rgba(8,8,8,.12) 45%, rgba(8,8,8,.35) 100%);
  }
  .bar {
    position: relative; display: flex; justify-content: space-between; align-items: flex-start;
    gap: 24px; padding: 44px 52px; min-height: 100vh; box-sizing: border-box;
    font-family: Archivo, Helvetica, Arial, sans-serif; text-transform: uppercase; line-height: 1;
  }
  .mark { font-weight: 500; font-size: 30px; letter-spacing: .34em; color: #f2f0ed; }
  .soon { font-weight: 400; font-size: 13px; letter-spacing: .3em; color: rgba(242,240,237,.86); padding-top: 9px; }
  @media (max-width: 600px) {
    .bar { padding: 28px 24px; }
    .mark { font-size: 22px; }
    .soon { font-size: 11px; padding-top: 5px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <img src="technician_background.jpg" alt="">
    <div class="scrim"></div>
    <div class="bar">
      <div class="mark">Lore</div>
      <div class="soon">Coming Soon</div>
    </div>
  </div>
</body>
</html>
